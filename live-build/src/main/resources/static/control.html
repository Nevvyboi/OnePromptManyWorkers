<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Build — control</title>
<style>
  :root{--ink:#0B0D12;--panel:#141824;--line:#2A3040;--paper:#ECE7DE;--muted:#8A8FA0;--faint:#5a6072;
    --amber:#F5A524;--teal:#2DD4BF;--violet:#8B5CF6;--rose:#FB7185;--sky:#38BDF8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);min-height:100vh;padding:24px}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:24px;max-width:1100px;margin:0 auto}
  h1{font-size:1.1rem;font-weight:800;margin-bottom:.2rem}
  .eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);margin-bottom:1rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .qr{text-align:center}
  .qr img{width:100%;max-width:230px;background:#fff;border-radius:12px;padding:10px}
  .qr .url{font-family:var(--mono);font-size:.82rem;color:var(--amber);margin-top:.7rem;word-break:break-all}
  .qr .hint{font-size:.78rem;color:var(--muted);margin-top:.5rem;line-height:1.5}
  .links{display:flex;gap:8px;margin-top:14px}
  .links a{flex:1;text-align:center;font-family:var(--mono);font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:9px;text-decoration:none}
  .links a:hover{border-color:var(--amber);color:var(--paper)}
  .qrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .qrow .n{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .mode{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  .live{font-family:var(--mono);font-size:.68rem;color:var(--rose);margin-left:.7rem;
        border:1px solid var(--rose);border-radius:99px;padding:.12rem .5rem}
  .live.on{color:var(--teal);border-color:var(--teal)}
  .live.on::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
        background:var(--teal);margin-right:.35rem;vertical-align:middle;animation:lp 1.6s ease-in-out infinite}
  @keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}
  .queue{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .empty{color:var(--faint);font-family:var(--mono);font-size:.82rem;padding:20px 4px}
  .item{display:flex;align-items:center;gap:14px;background:#0f131c;border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s}
  .item.done{opacity:.5}
  .item .txt{flex:1;min-width:0}
  .item .txt .t{font-size:1rem;line-height:1.3}
  .item .txt .m{font-family:var(--mono);font-size:.7rem;color:var(--faint);margin-top:3px}
  .item button{background:var(--amber);color:#12100a;border:none;border-radius:9px;font-weight:700;padding:10px 16px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .item button.hide{background:none;border:1px solid var(--line);color:var(--faint);font-weight:600;padding:10px 12px}
  .item button.hide:hover{border-color:var(--rose);color:var(--rose)}
  .item button.del{background:none;border:1px solid var(--line);color:var(--faint);font-weight:600;padding:10px 12px}
  .item button.del:hover{border-color:var(--rose);background:var(--rose);color:#12100a}
  .flag{display:inline-block;margin-left:.6rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);border:1px solid var(--rose);border-radius:11px;padding:.1rem .5rem;vertical-align:middle}
  .item button:disabled{background:#2a3040;color:var(--faint);cursor:default}
  .running{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
  .gate{margin-top:14px;width:100%;border:none;border-radius:10px;padding:13px;cursor:pointer;
        font-family:var(--sans);font-weight:700;font-size:.95rem;background:var(--teal);color:#06201c}
  .gate.closed{background:var(--rose);color:#2a0710}
  .auto{margin-top:10px;width:100%;border:1px solid var(--amber);border-radius:10px;padding:12px;cursor:pointer;
        font-family:var(--sans);font-weight:700;font-size:.92rem;background:none;color:var(--amber)}
  .auto.on{background:var(--amber);color:#12100a}
  .nextup{font-family:var(--mono);font-size:.72rem;color:var(--amber);margin-top:7px;min-height:1rem;opacity:.9}
  .demo{margin-top:14px;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:11px;width:100%;cursor:pointer;font-family:var(--mono);font-size:.8rem}
  .status{font-family:var(--mono);font-size:.78rem;color:var(--teal);margin-top:12px;min-height:1.1rem}
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="eyebrow">presenter control</div>
      <div class="card qr">
        <img id="qr" alt="join QR" src="/api/qr">
        <div class="url" id="url">…</div>
        <div class="hint">Anyone scans this and submits an idea. No wifi to join.</div>
        <div class="links">
          <a href="/stage" target="_blank">Open stage ↗</a>
          <a href="/" target="_blank">Audience view ↗</a>
        </div>
      </div>
      <button class="gate" id="gate">Close submissions</button>
      <button class="auto" id="auto">▶▶ Auto-advance: off</button>
      <div class="nextup" id="nextup"></div>
      <button class="demo" id="demo">▶ Run a built-in demo idea</button>
      <div class="status" id="status"></div>
    </div>

    <div>
      <div class="qrow">
        <div><h1>Submissions</h1><span class="n">tap Run to build one on the big screen</span></div>
        <span class="mode" id="mode"></span><span class="live" id="live">connecting…</span>
      </div>
      <div class="card">
        <div class="queue" id="queue"><div class="empty">No ideas yet. When people scan and submit, they show up here.</div></div>
      </div>
    </div>
  </div>

<script>
  const esc = s => (s||"").replace(/[&<>]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  let running = null;

  fetch("/api/info").then(r=>r.json()).then(d=>{
    document.getElementById("url").textContent = d.audienceUrl || (location.origin+"/");
    document.getElementById("mode").textContent = d.mock ? "mock mode" : ((d.model || "local model") + " · local");
  });

  function render(items){
    const q = document.getElementById("queue");
    if(!items || !items.length){ q.innerHTML = '<div class="empty">No ideas yet. When people scan and submit, they show up here.</div>'; return; }
    q.innerHTML = "";
    items.slice().reverse().forEach(it=>{
      const el = document.createElement("div");
      el.className = "item" + (it.status==="done"?" done":"") + (running===it.id?" running":"");
      const flag = it.flagged ? '<span class="flag">check this one</span>' : "";
      el.innerHTML = `<div class="txt"><div class="t">${esc(it.text)}${flag}</div><div class="m">${it.name?esc(it.name)+" · ":""}#${it.id}${it.status==="done"?" · built":""}</div></div>`;
      const hide = document.createElement("button");
      hide.textContent = "Hide"; hide.className = "hide"; hide.title = "Take it off the list, keep the build";
      hide.onclick = () => fetch("/api/hide/"+it.id+"?key="+encodeURIComponent(KEY), {method:"POST"});
      el.appendChild(hide);
      const del = document.createElement("button");
      del.textContent = "Delete"; del.className = "del"; del.title = "Remove it for good, from the gallery and disk";
      del.onclick = () => { if (confirm("Delete #"+it.id+" for good? This also removes it from the gallery.")) fetch("/api/delete/"+it.id+"?key="+encodeURIComponent(KEY), {method:"POST"}); };
      el.appendChild(del);
      const b = document.createElement("button");
      b.textContent = running===it.id ? "building…" : (it.status==="done"?"Run again":"Run");
      b.disabled = !!running;
      b.onclick = () => run(it.id);
      el.appendChild(b);
      q.appendChild(el);
    });
  }
  // the presenter key travels with this page's URL, so Run stays presenter-only
  const KEY = new URLSearchParams(location.search).get("key") || "";
  async function run(id){
    running = id;
    document.getElementById("status").textContent = "Building on the stage…";
    const r = await fetch("/api/run/"+id+"?key="+encodeURIComponent(KEY), {method:"POST"});
    if (r.status === 403){ running=null; document.getElementById("status").textContent = "Presenter key missing. Open the control URL from your terminal."; }
  }
  document.getElementById("demo").onclick = () => run("demo");

  // the doors: open at the start of the talk, closed before the reveal
  let gateOpen = true;
  function paintGate(){
    const b = document.getElementById("gate");
    b.textContent = gateOpen ? "Close submissions" : "Open submissions";
    b.classList.toggle("closed", !gateOpen);
  }
  document.getElementById("gate").onclick = async () => {
    const next = !gateOpen;
    const r = await fetch("/api/gate?key=" + encodeURIComponent(KEY) + "&open=" + next, { method: "POST" });
    if (r.ok){ gateOpen = next; paintGate(); }
  };
  fetch("/api/info").then(r=>r.json()).then(d=>{ if (d.open !== undefined){ gateOpen = d.open; paintGate(); } });

  // auto-advance: the stage rolls through the queue by itself
  let autoOn = false;
  function paintAuto(next){
    const b = document.getElementById("auto");
    b.textContent = (autoOn ? "■ Auto-advance: on" : "▶▶ Auto-advance: off");
    b.classList.toggle("on", autoOn);
    const nu = document.getElementById("nextup");
    nu.textContent = (autoOn && next) ? ("next up → " + next) : "";
  }
  document.getElementById("auto").onclick = async () => {
    const next = !autoOn;
    const r = await fetch("/api/auto?key=" + encodeURIComponent(KEY) + "&on=" + next, { method: "POST" });
    if (r.ok){ autoOn = next; paintAuto(); }
    else if (r.status === 403){ document.getElementById("status").textContent = "Presenter key missing."; }
  };

  function refreshQueue(){ fetch("/api/queue?key="+encodeURIComponent(KEY)).then(r=>r.json()).then(d=>render(d.ideas)).catch(()=>{}); }

  // This page must never sit there quietly out of date. A stream can drop, and
  // a restarted server leaves the old one closed for good, so we reconnect, poll
  // as a second belt, and say plainly on screen whether what you are reading is live.
  let es = null, lastBeat = 0;
  function setLive(ok){
    const el = document.getElementById("live");
    el.textContent = ok ? "live" : "reconnecting…";
    el.className = "live" + (ok ? " on" : "");
  }
  function connect(){
    try { if (es) es.close(); } catch(e){}
    es = new EventSource("/api/events");
    es.onopen = () => { lastBeat = Date.now(); setLive(true); refreshQueue(); };
    es.addEventListener("queue", e => { lastBeat = Date.now(); setLive(true); render(JSON.parse(e.data).ideas); });
    es.addEventListener("gate", e => { lastBeat = Date.now(); gateOpen = JSON.parse(e.data).open; paintGate(); });
    es.addEventListener("auto", e => { lastBeat = Date.now(); const d = JSON.parse(e.data); autoOn = d.on; paintAuto(d.next); });
    es.addEventListener("tally", e => { lastBeat = Date.now(); });
    es.addEventListener("beat", e => { lastBeat = Date.now(); setLive(true); });
    es.addEventListener("run-start", e => { lastBeat = Date.now(); running = JSON.parse(e.data).id; document.querySelectorAll(".item button").forEach(b=>b.disabled=true); });
    es.addEventListener("run-done", e => { lastBeat = Date.now(); running=null;
      document.getElementById("status").textContent = autoOn ? "Auto-advancing to the next…" : "Done. Pick the next one."; refreshQueue(); });
    es.onerror = () => { setLive(false); if (es.readyState === 2) setTimeout(connect, 1500); };
  }
  connect();
  refreshQueue();
  // second belt: poll anyway, so a silently dead stream still cannot leave you stale
  setInterval(() => {
    refreshQueue();
    const stale = Date.now() - lastBeat > 35000;
    if (!es || es.readyState === 2 || stale) { setLive(false); connect(); }
    else setLive(es.readyState === 1);
  }, 5000);
  // and come straight back when the laptop wakes or you switch back to this tab
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ refreshQueue(); if (!es || es.readyState !== 1) connect(); } });
</script>
</body>
</html>
