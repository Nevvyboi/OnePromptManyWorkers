<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter only</title>
<style>
  body{background:#0B0D12;color:#8A8FA0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:2rem}
  h2{color:#ECE7DE;font-size:1.6rem;margin:0 0 .6rem}
  p{margin:0;line-height:1.6}
  code{color:#F5A524;font-family:ui-monospace,Menlo,Consolas,monospace}
  .dot{width:10px;height:10px;border-radius:50%;background:#F5A524;display:inline-block;margin-bottom:1.2rem}
</style>
</head>
<body>
  <div>
    <span class="dot"></span>
    <h2>Presenter only</h2>
    <p>This panel drives the big screen.<br>
    Open the control URL printed in the speaker's terminal, the one ending in <code>?key=…</code></p>
  </div>
</body>
</html>
