<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to join</title>
<style>
  :root{--ink:#0B0D12;--paper:#ECE7DE;--muted:#8A8FA0;--amber:#F5A524;--teal:#2DD4BF;--violet:#8B5CF6;--rose:#FB7185;--sky:#38BDF8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(110% 80% at 50% -10%,#12151E 0%,var(--ink) 55%);color:var(--paper);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;text-align:center;padding:5vh}
  .eyebrow{font-family:var(--mono);font-size:1rem;letter-spacing:.34em;text-transform:uppercase;color:var(--amber)}
  h1{font-weight:800;font-size:clamp(2.4rem,6vw,4.6rem);letter-spacing:-.02em;line-height:1}
  h1 em{font-style:normal;color:var(--amber)}
  .qr{background:#fff;border-radius:24px;padding:22px;box-shadow:0 40px 120px -40px rgba(245,165,36,.35)}
  .qr img{width:min(38vh,340px);height:min(38vh,340px);display:block}
  .url{font-family:var(--mono);font-size:clamp(1rem,2.4vw,1.5rem);color:var(--amber);letter-spacing:.02em}
  .steps{display:flex;gap:clamp(1rem,4vw,3rem);flex-wrap:wrap;justify-content:center;margin-top:.5vh}
  .step{display:flex;align-items:center;gap:.7rem;font-size:clamp(.9rem,1.6vw,1.15rem);color:var(--muted)}
  .step b{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#12100a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex:none}
  .dots{display:flex;gap:9px;margin-top:1vh}
  .dots i{width:12px;height:12px;border-radius:50%;display:block}
</style>
</head>
<body>
  <div class="eyebrow">the crew is waiting</div>
  <h1>Scan. Type <em>one line.</em><br>Watch it get built.</h1>
  <div class="qr"><img id="qr" src="/api/qr" alt="join"></div>
  <div class="url" id="url">…</div>
  <div class="steps">
    <div class="step"><b>1</b> Join the room's Wi-Fi</div>
    <div class="step"><b>2</b> Scan the code</div>
    <div class="step"><b>3</b> Send the crew an idea</div>
  </div>
  <div class="dots"><i style="background:var(--teal)"></i><i style="background:var(--violet)"></i><i style="background:var(--amber)"></i><i style="background:var(--rose)"></i><i style="background:var(--sky)"></i></div>
<script>
  fetch("/api/info").then(r=>r.json()).then(d=>document.getElementById("url").textContent=(d.audienceUrl||location.origin));
</script>
</body>
</html>
