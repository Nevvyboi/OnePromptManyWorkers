<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Build — the stage</title>
<style>
  :root{
    --ink:#0B0D12; --ink2:#0E1119; --panel:#141824; --panel2:#10131c; --line:#242a3a;
    --paper:#ECE7DE; --muted:#8A8FA0; --faint:#5a6072;
    --amber:#F5A524; --teal:#2DD4BF; --violet:#8B5CF6; --rose:#FB7185; --sky:#38BDF8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(120% 90% at 20% -10%,#12151E 0%,var(--ink) 55%);color:var(--paper);font-family:var(--sans);display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:1.2rem;padding:1.5vh 2.4vw;border-bottom:1px solid var(--line);flex:none}
  .live{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--amber)}
  .live .blip{width:11px;height:11px;border-radius:50%;background:var(--amber);animation:blip 1.5s infinite}
  @keyframes blip{0%{box-shadow:0 0 0 0 rgba(245,165,36,.55)}70%{box-shadow:0 0 0 13px rgba(245,165,36,0)}100%{box-shadow:0 0 0 0 rgba(245,165,36,0)}}
  header .idea{flex:1;font-family:var(--serif);font-size:clamp(1.1rem,2.2vw,2rem);color:var(--paper);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .idea .lbl{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;display:block;margin-bottom:.15rem}
  header .by{font-family:var(--mono);font-size:.8rem;color:var(--muted)}

  main{flex:1;display:grid;grid-template-columns:30% 1fr;gap:2vw;padding:2vh 2.4vw;min-height:0}

  /* ---- the web ---- */
  .net{display:flex;flex-direction:column;min-height:0;gap:.6rem}
  .net .h{font-family:var(--mono);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
  #web{width:100%;flex:1;min-height:0}
  .edge{fill:none;stroke:var(--line);stroke-width:1.6;transition:stroke .3s}
  .edge.feedback{stroke-dasharray:5 6}
  .edge.hot{stroke:var(--ec,var(--amber));filter:drop-shadow(0 0 6px var(--ec,var(--amber)))}
  .node circle.body{fill:var(--panel);stroke:var(--nc);stroke-width:1.6;transition:fill .3s}
  .node.done circle.body{fill:var(--nc)}
  .node .ring{fill:none;stroke:var(--nc);stroke-width:2;stroke-dasharray:40 90;opacity:0;transform-box:fill-box;transform-origin:center}
  .node.working .ring,.node.assisting .ring{opacity:1;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .node text{font-family:var(--mono);text-anchor:middle}
  .node .lab{fill:var(--paper);font-size:12.5px;letter-spacing:.06em}
  .node .st{fill:var(--faint);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
  .node.working .st,.node.assisting .st{fill:var(--nc)}
  .node.done .st{fill:var(--nc)}
  .node.idle{opacity:.55}

  .feed{flex:none;max-height:26vh;overflow:hidden;display:flex;flex-direction:column;gap:.45rem}
  .feed .row{font-family:var(--mono);font-size:.76rem;color:var(--muted);line-height:1.35;border-left:2px solid var(--fc,var(--line));padding-left:.7rem;animation:fin .3s ease}
  .feed .row b{color:var(--paper);font-weight:600}
  @keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

  /* ---- the build frame ---- */
  .build{min-height:0;display:flex;flex-direction:column}
  .frame{flex:1;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#fff;box-shadow:0 40px 90px -50px #000;min-height:0}
  .chrome{flex:none;display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:#0d1017;border-bottom:1px solid var(--line)}
  .chrome .dot{width:11px;height:11px;border-radius:50%}
  .chrome .url{margin-left:.6rem;font-family:var(--mono);font-size:.72rem;color:var(--faint);background:#161a24;padding:.3rem .8rem;border-radius:7px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viewport{flex:1;overflow:auto;position:relative}

  .pg{--pg-bg:#0e1016;--pg-surface:#171a22;--pg-ink:#ECE7DE;--pg-muted:#9aa0ae;--pg-primary:#F5A524;--pg-accent:#38BDF8;--pg-font:var(--sans);
      min-height:100%;background:var(--pg-bg);color:var(--pg-ink);font-family:var(--pg-font);
      transition:background .8s ease,color .8s ease;padding:clamp(1.4rem,3vw,3rem)}
  .waiting{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;text-align:center}
  .waiting .pulse{width:70px;height:70px;border-radius:50%;background:var(--amber);opacity:.85;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.1);opacity:.95}}
  .waiting h3{font-family:var(--serif);font-size:1.8rem;color:#2a2e38}
  .waiting p{font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;color:#242833}

  .sec{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
  .sec.in{opacity:1;transform:none}
  .hero h1{font-weight:800;font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.05;letter-spacing:-.02em;max-width:20ch;transition:opacity .25s;border-radius:8px}
  .hero h1.flash{animation:flash 1.6s ease}
  @keyframes flash{0%{background:rgba(245,165,36,0)}18%{background:rgba(245,165,36,.45)}100%{background:transparent}}
  .rev-tag{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--pg-primary);border:1px dashed var(--pg-primary);border-radius:16px;padding:.22rem .7rem;margin-top:.7rem;opacity:0;transition:opacity .5s}
  .rev-tag.show{opacity:1}
  .hero .subh{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--pg-muted);margin-top:1rem;max-width:44ch;line-height:1.5}
  .hero .cta{display:inline-block;margin-top:1.6rem;background:var(--pg-primary);color:#12100a;font-weight:700;padding:.85rem 1.6rem;border-radius:11px;font-size:1.05rem}
  .badge{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pg-primary);border:1px solid var(--pg-primary);border-radius:20px;padding:.3rem .8rem;margin-bottom:1.2rem}
  .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.4rem}
  @media(max-width:1100px){.feats{grid-template-columns:1fr}}
  .feat{background:var(--pg-surface);border-radius:13px;padding:1.3rem 1.2rem}
  .feat .fi{width:34px;height:34px;border-radius:9px;background:var(--pg-accent);opacity:.9;margin-bottom:.8rem}
  .feat h4{font-size:1.15rem;font-weight:700;margin-bottom:.4rem}
  .feat p{font-size:.92rem;color:var(--pg-muted);line-height:1.5}
  .skeptic{margin-top:2rem;border-left:3px solid var(--rose);background:rgba(251,113,133,.08);padding:.9rem 1.2rem;border-radius:0 10px 10px 0;font-size:.95rem;color:var(--pg-muted)}
  .skeptic b{color:var(--rose);font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:.3rem}

  footer{flex:none;display:flex;align-items:center;justify-content:space-between;padding:1.2vh 2.4vw;border-top:1px solid var(--line);font-family:var(--mono);font-size:.74rem;color:var(--faint);letter-spacing:.1em}
  footer .join{color:var(--muted)} footer .join b{color:var(--amber)}
  .tally b{color:var(--paper)}
</style>
</head>
<body>
  <header>
    <span class="live"><span class="blip"></span> Live Build</span>
    <div class="idea"><span class="lbl">one prompt</span><span id="ideaText">waiting for an idea…</span></div>
    <span class="by" id="byText"></span>
  </header>

  <main>
    <section class="net">
      <div class="h">the web · agents helping agents</div>
      <svg id="web" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <div class="feed" id="feed"></div>
    </section>

    <section class="build">
      <div class="frame">
        <div class="chrome">
          <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
          <span class="url" id="url">about:blank</span>
        </div>
        <div class="viewport">
          <div class="pg" id="pg">
            <div class="waiting" id="waiting">
              <div class="pulse"></div>
              <h3>Ready for your idea</h3>
              <p>scan the code · type one line · watch it get built</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span class="tally"><b id="tally">0</b> ideas submitted</span>
    <span class="join">scan the QR to join · everything runs <b>on this laptop</b></span>
    <span id="mode"></span>
  </footer>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const COLORS = { copywriter:"#2DD4BF", designer:"#8B5CF6", builder:"#38BDF8", skeptic:"#FB7185", planner:"#F5A524" };
  const web = document.getElementById("web");
  const feedEl = document.getElementById("feed");
  const pg = document.getElementById("pg");
  let pageState = null, nodePos = {}, edgeIds = {};

  // ---- the web graph ----
  const FIXED = { copywriter:[200,62], designer:[62,200], builder:[338,200], skeptic:[200,338] };
  const R = 27, C = [200,200];

  function drawGraph(nodes, edges){
    web.innerHTML = ""; nodePos = {}; edgeIds = {};
    nodes.forEach((n,i)=>{
      nodePos[n.key] = FIXED[n.key] || [ C[0]+150*Math.cos(2*Math.PI*i/nodes.length-Math.PI/2), C[1]+150*Math.sin(2*Math.PI*i/nodes.length-Math.PI/2) ];
    });
    edges.forEach(e=>{
      const a = nodePos[e.from], b = nodePos[e.to]; if(!a||!b) return;
      const mid = [(a[0]+b[0])/2,(a[1]+b[1])/2];
      let dx = mid[0]-C[0], dy = mid[1]-C[1], len = Math.hypot(dx,dy);
      let ctrl;
      if (len < 12){ const nx=-(b[1]-a[1]), ny=b[0]-a[0], nl=Math.hypot(nx,ny); ctrl=[mid[0]+72*nx/nl, mid[1]+72*ny/nl]; }
      else ctrl = [mid[0]+46*dx/len, mid[1]+46*dy/len];
      const trim=(p,q)=>{ const vx=q[0]-p[0], vy=q[1]-p[1], vl=Math.hypot(vx,vy); return [p[0]+R*vx/vl, p[1]+R*vy/vl]; };
      const s = trim(a,ctrl), t = trim(b,ctrl);
      const path = document.createElementNS(NS,"path");
      const id = "e-"+e.from+"-"+e.to; path.id = id; edgeIds[e.from+">"+e.to] = id;
      path.setAttribute("d",`M ${s[0]},${s[1]} Q ${ctrl[0]},${ctrl[1]} ${t[0]},${t[1]}`);
      path.setAttribute("class","edge"+(e.feedback?" feedback":""));
      web.appendChild(path);
    });
    nodes.forEach(n=>{
      const [x,y] = nodePos[n.key];
      const g = document.createElementNS(NS,"g");
      g.setAttribute("class","node idle"); g.id = "n-"+n.key;
      g.style.setProperty("--nc", COLORS[n.key]||"#8A8FA0");
      g.innerHTML = `<circle class="ring" cx="${x}" cy="${y}" r="${R+7}"></circle>
        <circle class="body" cx="${x}" cy="${y}" r="${R}"></circle>
        <text class="lab" x="${x}" y="${y+4}">${n.label}</text>
        <text class="st" x="${x}" y="${y+R+16}">queued</text>`;
      web.appendChild(g);
    });
  }
  function setNode(key, state, stText){
    const g = document.getElementById("n-"+key); if(!g) return;
    g.setAttribute("class","node "+state);
    g.querySelector(".st").textContent = stText || state;
    if (state==="done") g.querySelector(".lab").setAttribute("fill","#0B0D12");
  }
  function pulse(from, to, color){
    const id = edgeIds[from+">"+to]; const path = id && document.getElementById(id); if(!path) return;
    path.style.setProperty("--ec", color || COLORS[from] || "#F5A524");
    path.classList.add("hot"); setTimeout(()=>path.classList.remove("hot"), 1300);
    const dot = document.createElementNS(NS,"circle");
    dot.setAttribute("r","5"); dot.setAttribute("fill", color || COLORS[from] || "#F5A524");
    const am = document.createElementNS(NS,"animateMotion");
    am.setAttribute("dur","0.9s"); am.setAttribute("fill","freeze");
    const mp = document.createElementNS(NS,"mpath");
    mp.setAttributeNS("http://www.w3.org/1999/xlink","href","#"+id);
    am.appendChild(mp); dot.appendChild(am); web.appendChild(dot);
    setTimeout(()=>dot.remove(), 1000);
  }
  function feed(html, color){
    const row = document.createElement("div");
    row.className = "row"; row.style.setProperty("--fc", color || "var(--line)");
    row.innerHTML = html;
    feedEl.prepend(row);
    while (feedEl.children.length > 6) feedEl.lastChild.remove();
  }

  // ---- the page being built ----
  function ensurePage(){
    if (pageState) return;
    document.getElementById("waiting")?.remove();
    pageState = document.createElement("div");
    pageState.innerHTML = `
      <div class="sec hero" id="s-hero"><span class="badge" id="p-badge">new</span><h1 id="p-head"></h1><br><span class="rev-tag" id="p-rev">revised after the skeptic's critique</span><div class="subh" id="p-sub"></div><span class="cta" id="p-cta"></span></div>
      <div class="sec feats" id="s-feats"></div>
      <div class="sec skeptic" id="s-skeptic" style="display:none"><b>the skeptic says</b><span id="p-skeptic"></span></div>`;
    pg.appendChild(pageState);
  }
  const show = id => { const e=document.getElementById(id); if(e){ e.style.display=""; requestAnimationFrame(()=>e.classList.add("in")); } };
  const esc = s => (s||"").replace(/[&<>]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  const slug = s => (s||"idea").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,26);

  function applyCopy(c){
    ensurePage();
    document.getElementById("p-badge").textContent = c.badge || "introducing";
    document.getElementById("p-head").textContent = c.headline || "";
    document.getElementById("p-sub").textContent = c.subhead || "";
    document.getElementById("p-cta").textContent = c.cta || "Get started";
    show("s-hero");
    const feats = document.getElementById("s-feats"); feats.innerHTML="";
    (c.features||[]).forEach(f=>{
      const d=document.createElement("div"); d.className="feat";
      d.innerHTML=`<div class="fi"></div><h4>${esc(f.title)}</h4><p>${esc(f.body)}</p>`;
      feats.appendChild(d);
    });
    show("s-feats");
  }
  function applyDesign(d){
    const s = pg.style;
    for (const [k,v] of [["bg",d.bg],["surface",d.surface],["ink",d.ink],["muted",d.muted],["primary",d.primary],["accent",d.accent],["font",d.font]])
      if (v) s.setProperty("--pg-"+k, v);
  }
  function applySkeptic(t){ ensurePage(); document.getElementById("p-skeptic").textContent=t; show("s-skeptic"); }
  function applyRevise(r){
    const h = document.getElementById("p-head"); if(!h) return;
    h.classList.remove("flash"); void h.offsetWidth;
    h.textContent = r.value; h.classList.add("flash");
    document.getElementById("p-rev").classList.add("show");
  }

  function resetStage(idea, name){
    web.innerHTML=""; feedEl.innerHTML=""; pageState=null;
    pg.removeAttribute("style");
    pg.innerHTML = `<div class="waiting" id="waiting"><div class="pulse"></div><h3>Assembling the web…</h3><p>${esc(idea||"")}</p></div>`;
    document.getElementById("ideaText").textContent = idea || "…";
    document.getElementById("byText").textContent = name ? "by "+name : "";
    document.getElementById("url").textContent = "https://"+slug(idea)+".local";
  }

  // ---- SSE ----
  const es = new EventSource("/api/events");
  const J = e => JSON.parse(e.data);
  es.addEventListener("info", e => { const d=J(e); document.getElementById("mode").textContent = d.mock ? "mock mode" : "qwen · local"; if(d.tally!=null) document.getElementById("tally").textContent=d.tally; });
  es.addEventListener("tally", e => { document.getElementById("tally").textContent = J(e).total; });
  es.addEventListener("run-start", e => { const d=J(e); resetStage(d.idea, d.name); });
  es.addEventListener("graph", e => { const d=J(e); drawGraph(d.nodes||[], d.edges||[]); });
  es.addEventListener("agent-state", e => {
    const d=J(e); setNode(d.key, d.state);
    if (d.note) feed(`<b>${d.key}</b> · ${esc(d.note)}`, COLORS[d.key]);
  });
  es.addEventListener("flow", e => {
    const d=J(e); pulse(d.from, d.to, COLORS[d.from]);
    feed(`<b>${d.from}</b> -> <b>${d.to}</b> · ${esc(d.what||"")}`, COLORS[d.from]);
  });
  es.addEventListener("worker-done", e => {
    const d=J(e);
    if(d.key==="copywriter" && d.payload) applyCopy(d.payload);
    if(d.key==="designer" && d.payload) applyDesign(d.payload);
    if(d.key==="skeptic" && d.payload) applySkeptic(d.payload.note || d.payload);
  });
  es.addEventListener("revise", e => { const d=J(e); applyRevise(d); });
  es.addEventListener("run-done", () => {});
  es.onerror = () => {/* auto-reconnects */};
</script>
</body>
</html>
